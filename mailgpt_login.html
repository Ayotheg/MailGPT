<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailGPT - Login</title>
 <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Covered+By+Your+Grace&family=Numans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
    <a href="#" class="back-link">
        ← Back to Home
    </a>

    <div class="bg-animation">
        <div class="bg-element"></div>
        <div class="bg-element"></div>
    </div>

    <div class="login-container">
        <div class="logo-section">
            <div class="logo">MailGPT</div>
            <div class="logo-tagline">Where emails become art</div>
        </div>

        <div class="login-card">
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Sign in to continue creating stunning emails</p>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-login">
                <button class="btn-social" id="googleLogin">
                    <span><i class="hgi hgi-stroke hgi-google"></i></span>
                    Google
                </button>
                <button class="btn-social" id="githubLogin">
                    <span><i class="hgi hgi-stroke hgi-github"></i></span>
                    GitHub
                </button>
            </div>

            <div class="signup-link">
                Don't have an account? <a href="#">Sign up for free</a>
            </div>
        </div>
    </div>

    <script>
        // Form submission handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // Here you would typically make an API call to your backend
            console.log('Login attempt:', { email, password, remember });
            
            // Simulate login process
            const btn = document.querySelector('.btn-login');
            btn.textContent = 'Signing in...';
            btn.style.opacity = '0.7';
            
            setTimeout(() => {
                btn.textContent = 'Success! ✓';
                btn.style.background = 'linear-gradient(135deg, #28a745, #20c997)';
                
                setTimeout(() => {
                    // Redirect to dashboard or home
                    alert('Login successful! Redirecting to dashboard...');
                    // window.location.href = '/dashboard';
                }, 1000);
            }, 1500);
        });

        // Social login handlers
        document.getElementById('googleLogin').addEventListener('click', function() {
            console.log('Google login clicked');
            alert('Google OAuth integration would be implemented here');
        });

        document.getElementById('githubLogin').addEventListener('click', function() {
            console.log('GitHub login clicked');
            alert('GitHub OAuth integration would be implemented here');
        });

        // Add input focus animations
        const inputs = document.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateX(5px)';
                this.parentElement.style.transition = 'transform 0.3s ease';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateX(0)';
            });
        });
    </script>
</body>
</html>
